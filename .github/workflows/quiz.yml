name: quiz

on:
  push:
    paths:
      - "apps/**"
      - "features/**"
      - "internal/**"
      - ".github/workflows/quiz.yml"
      - ".github/actions/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter "@platform/cli..." --filter "@platform/api..." --filter "@platform/web..." lint
